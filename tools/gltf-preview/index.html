<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>glTF preview</title>
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; background: #111; }
      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        max-width: 80%;
      }
      button {
        background: #2a3340;
        color: #fff;
        border: 1px solid #556;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button.active { background: #ff6b2c; border-color: #ff6b2c; color: #1a1208; }
      #credit { font-size: 12px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="ui">
      <button type="button" id="dc8" class="active">NASA DC-8</button>
      <label>or file <input id="file" type="file" accept=".gltf,.glb" /></label>
      <span id="credit">NASA Airborne Science · public domain</span>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
