<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Texture preview</title>
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; background: #111; }
      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        max-width: 70%;
      }
      button {
        background: #2a3340;
        color: #fff;
        border: 1px solid #556;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button.active { background: #ff6b2c; border-color: #ff6b2c; color: #1a1208; }
      label { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="ui">
      <strong>Samples</strong>
      <button type="button" data-src="/samples/sand.png">Sand</button>
      <button type="button" data-src="/samples/ocean.png">Ocean</button>
      <button type="button" data-src="/samples/rust.png">Rust</button>
      <button type="button" data-src="/samples/asphalt.png">Asphalt</button>
      <button type="button" data-src="/samples/checker.png">Checker</button>
      <label>or file <input id="file" type="file" accept="image/*" /></label>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
