<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beach Buggy Classic</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="hud-top">
          <div id="place">1st</div>
          <div id="lap">Lap 1 / 3</div>
          <div id="speed">0 mph</div>
        </div>
        <div id="countdown"></div>
        <div id="message"></div>
        <div id="controls-hint">Arrows / WASD · Space boost · R restart</div>
      </div>
      <div id="overlay" class="hidden">
        <h1 id="overlay-title">Beach Buggy Classic</h1>
        <p id="overlay-sub">Race the beach. Beat the bots.</p>
        <button id="start-btn" type="button">Start Race</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
